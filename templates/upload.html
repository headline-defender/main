<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<title>アップロード - 座標指定付き</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body {
			margin: 0;
			padding: 20px;
			font-family: sans-serif;
			background: #1c1c1c;
			color: white;
		}

		/* コンテナを flex でセンター配置 */
		.center-container {
			display: flex;
			flex-direction: column;
			align-items: center;
			/* 横方向中央揃え */
			justify-content: center;
			/* 縦方向中央揃え */
			min-height: 60vh;
			width: 95%;
			max-width: 1100px;
			margin: 0 auto;
		}

		/* マップ画像クリック用エリア */
		#mapContainer {
			position: relative;
			cursor: pointer;
			/* ポインターに統一 */
			margin-bottom: 20px;
			/* 中央に表示しつつ最大表示領域を制限 */
			display: flex;
			justify-content: center;
			align-items: center;
			max-width: 100%;
			max-height: 70vh;
			overflow: hidden;
		}

		#mapImage {
			display: block;
			max-width: 100%;
			max-height: 70vh;
			width: auto;
			height: auto;
			object-fit: contain;
			margin: 0 auto;
		}

		#marker {
			position: absolute;
			width: 10px;
			height: 10px;
			background: red;
			border-radius: 50%;
			transform: translate(-50%, -50%);
			display: none;
			pointer-events: none;
		}

		#vectorCanvas {
			position: absolute;
			pointer-events: none;
		}

		/* ベクトル長さコントロール */
		#vectorControls {
			display: none;
			background: rgba(0, 0, 0, 0.45);
			padding: 8px;
			border-radius: 6px;
			color: #fff;
			position: absolute;
			right: 12px;
			top: 12px;
			z-index: 50;
		}

		#vectorControls input[type="range"] {
			width: 180px;
		}

		form {
			background: #2b2b2b;
			padding: 15px;
			border-radius: 6px;
			max-width: 900px;
			width: 100%;
		}

		form input,
		form select,
		form button {
			width: 100%;
			margin-bottom: 10px;
			padding: 6px;
			border: none;
			border-radius: 4px;
		}

		form button {
			background: #ff4655;
			color: white;
			cursor: pointer;
		}

		form button:hover {
			background: #e03e4a;
		}

		textarea {
			resize: none;
			font-size: 110%;
			width: 100%;
			height: 80px;
		}

		.form-check-label {
			display: flex;
			white-space: nowrap;
			align-items: center;
			margin-bottom: 15px;
			/* 必要に応じて調整 */
			margin-right: 200px;
			/* チェックボックスとラベルの間隔を調整 */
		}

		.form-check-input {
			margin-bottom: 0px;
			margin-right: 1px;
			/* チェックボックスとラベルの間隔を調整 */
			white-space: nowrap;
		}

		.required {
			color: red;
			font-weight: bold;
		}

		/* 共通セレクトグリッド */
		.select-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
			gap: 0.75rem;
			align-items: center;
		}

		/* マップ用は横幅を大きく使う */
		#mapGrid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
			gap: 1rem;
			max-width: 1000px;
			margin: 0 auto;
		}

		/* エージェントは横に並べて見やすく */
		#agentGrid {
			grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
			gap: 0.6rem;
			justify-items: center;
		}

		.select-item {
			position: relative;
			border-radius: 8px;
			overflow: hidden;
			cursor: pointer;
			text-align: center;
			transition: transform 0.15s, filter 0.15s;
			padding: 6px;
			background: #222;
		}

		.select-item:hover {
			filter: brightness(1.15);
			transform: translateY(-3px);
		}

		.select-item.active {
			outline: 3px solid #22d3ee;
		}

		.select-item.map img {
			width: 100%;
			height: 140px;
			object-fit: cover;
			display: block;
		}

		.select-item.agent img {
			width: 80px;
			height: 80px;
			object-fit: contain;
			background: #1e1f2f;
			border-radius: 8px;
			display: block;
			margin: 0 auto;
		}

		.select-item .select-label {
			font-size: 0.85rem;
			color: #fff;
			margin-top: 6px;
		}
	</style>
</head>

<body>
	<div class="center-container">
		<h1>定点アップロード画面</h1>
		<button type="button" class="btn btn-primary" style="margin-left: 80%;" onclick="location.href='/'">
			定点一覧へ
		</button>
		<!-- マップ選択用エリア（アイコン） -->
		<div id="mapSelector">
			<label>マップ選択 <span class="required"> ※必須</span></label>
			<div class="select-grid" id="mapGrid">
				{% for map in maps %}
				<div class="select-item map" data-value="{{ map.value }}" data-image="{{ map.detail_path }}">
					<img src="{{ map.image_path }}" alt="{{ map.label }}">
					<div class="select-label">{{ map.label }}</div>
				</div>
				{% endfor %}
			</div>
		</div>
		<br>
		<!-- マップ表示とマーカー用エリア -->
		<div id="mapContainer">
			<img id="mapImage" src="" onclick="handleMapClick(event)">
			<canvas id="vectorCanvas"></canvas>
			<div id="vectorControls">
				<button type="button" id="vectorClear" class="btn btn-sm btn-light" style="margin-left:8px;"
					onclick="clearVector()">クリア</button>
			</div>
			<div id="marker"></div>
		</div>

		<!-- アップロードフォーム -->
		<form method="POST" enctype="multipart/form-data">
			<input type="hidden" name="map_name" id="map_name">
			<div class="mb-3">
				<label>配置タイプ <span class="required">※必須</span></label>
				<div class="d-flex gap-3">
					<div class="form-check">
						<input class="form-check-input" type="radio" name="marker_type" value="vector" checked>
						<label class="form-check-label">ベクトル</label>
					</div>
					<div class="form-check">
						<input class="form-check-input" type="radio" name="marker_type" value="point">
						<label class="form-check-label">ポイント</label>
					</div>
				</div>
			</div>

			<input type="hidden" name="vector_x2" id="markerX2">
			<input type="hidden" name="vector_y2" id="markerY2">

			<input type="hidden" name="marker_x" id="markerX" placeholder="X座標" readonly required>
			<input type="hidden" name="marker_y" id="markerY" placeholder="Y座標" readonly required>
			<!-- 以下、他の入力項目も追加 -->
			<div class="mb-3">
				<div class="select-grid" id="agentGrid">
					{% for agent in agents %}
					<div class="select-item agent" data-value="{{ agent.value }}" data-image="{{ agent.image_path }}">
						<img src="{{ agent.image_path }}" alt="{{ agent.label }}">
						<div class="select-label">{{ agent.label }}</div>
					</div>
					{% endfor %}
				</div>
				<input type="hidden" name="agent_name" id="agentInput">
			</div>
			<input type="text" name="site" placeholder="着地点（例: Aサイト）" required>
			<textarea name="description" placeholder="説明文" rows="3" cols="40" required></textarea>
			<input type="file" name="file" accept=".png,.jpg,.jpeg" required>
			<div class="mb-3">
				<label class="form-check-label" for="showStand">
					<input type="checkbox" name="stand_check" id="showStand" class="form-check-input">
					立ち位置画像を追加する
				</label>
			</div>
			<div id="standupForm" style="display: none; margin-top: 10px;">
				<textarea name="stand_description" placeholder="説明文" rows="3" cols="40"></textarea>
				<input type="file" name="stand_file" accept=".jpg,.jpeg,.png">
			</div>
			<button type="submit">登録</button>
		</form>
	</div>

	<script>
		// 選択グリッドセットアップ
		function setupSelection(gridId, inputId, onSelect) {
			const grid = document.getElementById(gridId);
			const input = document.getElementById(inputId);
			if (!grid || !input) return;
			grid.querySelectorAll('.select-item').forEach(item => {
				item.addEventListener('click', () => {
					grid.querySelectorAll('.select-item').forEach(i => i.classList.remove('active'));
					item.classList.add('active');
					input.value = item.dataset.value;
					if (onSelect) onSelect(item);
				});
			});
		}

		// マップ選択時は地図画像を更新してマーカー座標をリセット
		setupSelection('mapGrid', 'map_name', (item) => {
			document.getElementById('mapImage').src = item.dataset.image || ('/static/maps/' + item.dataset.value + '.png');
			document.getElementById('markerX').value = '';
			document.getElementById('markerY').value = '';
			// clear any existing vector when map changes
			clearVector();
			// hide marker when map changes
			const marker = document.getElementById('marker');
			if (marker) marker.style.display = 'none';
		});

		// エージェント選択（hidden input に値を入れる）
		setupSelection('agentGrid', 'agentInput');

		const checkbox = document.getElementById('showStand');
		const formDiv = document.getElementById('standupForm');
		const standTextarea = formDiv.querySelector('textarea');
		const standFile = formDiv.querySelector('input[type="file"]');
		checkbox.addEventListener('change', () => {
			formDiv.style.display = checkbox.checked ? 'block' : 'none';
			standTextarea.required = checkbox.checked;
			standFile.required = checkbox.checked;
		});

		function getCoords(event) {
			const img = event.target;
			const rect = img.getBoundingClientRect();

			const xRatio = ((event.clientX - rect.left) / rect.width) * 100;
			const yRatio = ((event.clientY - rect.top) / rect.height) * 100;

			const marker = document.getElementById('marker');
			marker.style.left = (event.clientX - rect.left) + 'px';
			marker.style.top = (event.clientY - rect.top) + 'px';
			marker.style.display = 'block';

			document.getElementById('markerX').value = xRatio.toFixed(3);
			document.getElementById('markerY').value = yRatio.toFixed(3);
		}
		let vectorStart = null;

		function handleMapClick(event) {
			const img = document.getElementById('mapImage');
			const rect = img.getBoundingClientRect();

			const x = event.clientX - rect.left;
			const y = event.clientY - rect.top;

			const xRatio = (x / rect.width) * 100;
			const yRatio = (y / rect.height) * 100;

			const type = document.querySelector('input[name="marker_type"]:checked').value;

			if (type === 'point') {
				setPoint(x, y, xRatio, yRatio);
			} else {
				setVector(x, y, xRatio, yRatio);
			}
		}

		function setPoint(x, y, xr, yr) {
			const marker = document.getElementById('marker');
			marker.style.left = x + 'px';
			marker.style.top = y + 'px';
			marker.style.display = 'block';

			document.getElementById('markerX').value = xr.toFixed(3);
			document.getElementById('markerY').value = yr.toFixed(3);

			clearVector();
		}

		function setVector(x, y, xr, yr) {
			if (!vectorStart) {
				vectorStart = { x, y, xr, yr };
				// place initial marker for vector start (do not clear vectorStart)
				const marker = document.getElementById('marker');
				marker.style.left = x + 'px';
				marker.style.top = y + 'px';
				marker.style.display = 'block';
				document.getElementById('markerX').value = xr.toFixed(3);
				document.getElementById('markerY').value = yr.toFixed(3);
				// ensure previous canvas cleared
				const canvas = document.getElementById('vectorCanvas');
				if (canvas) {
					const ctx = canvas.getContext('2d');
					ctx.clearRect(0, 0, canvas.width, canvas.height);
				}
				return;
			}

			// finalize vector and enable length control
			const end = { x, y, xr, yr };
			drawArrow(vectorStart.x, vectorStart.y, end.x, end.y);

			document.getElementById('markerX').value = vectorStart.xr.toFixed(3);
			document.getElementById('markerY').value = vectorStart.yr.toFixed(3);
			document.getElementById('markerX2').value = end.xr.toFixed(3);
			document.getElementById('markerY2').value = end.yr.toFixed(3);

			// store base distance and angle on canvas for slider adjustments
			const canvas = document.getElementById('vectorCanvas');
			const dx = end.x - vectorStart.x;
			const dy = end.y - vectorStart.y;
			canvas.dataset.baseDistance = Math.hypot(dx, dy);
			canvas.dataset.angle = Math.atan2(dy, dx);
			canvas.dataset.startX = vectorStart.x;
			canvas.dataset.startY = vectorStart.y;

			// show controls
			document.getElementById('vectorControls').style.display = 'block';

			vectorStart = null;
		}

		function drawArrow(x1, y1, x2, y2) {
			const canvas = document.getElementById('vectorCanvas');
			const img = document.getElementById('mapImage');

			canvas.width = Math.round(img.clientWidth || img.width || 0);
			canvas.height = Math.round(img.clientHeight || img.height || 0);

			const ctx = canvas.getContext('2d');
			ctx.clearRect(0, 0, canvas.width, canvas.height);

			const headLen = 10;
			const angle = Math.atan2(y2 - y1, x2 - x1);

			ctx.strokeStyle = 'red';
			ctx.lineWidth = 2;

			ctx.beginPath();
			ctx.moveTo(x1, y1);
			ctx.lineTo(x2, y2);
			ctx.stroke();

			ctx.beginPath();
			ctx.moveTo(x2, y2);
			ctx.lineTo(
				x2 - headLen * Math.cos(angle - Math.PI / 6),
				y2 - headLen * Math.sin(angle - Math.PI / 6)
			);
			ctx.lineTo(
				x2 - headLen * Math.cos(angle + Math.PI / 6),
				y2 - headLen * Math.sin(angle + Math.PI / 6)
			);
			ctx.closePath();
			ctx.fillStyle = 'red';
			ctx.fill();
		}

		document.getElementById('vectorClear').addEventListener('click', () => {
			clearVector();
			document.getElementById('vectorControls').style.display = 'none';
		});

		// マーカータイプ変更時にベクトル状態とマーカーをクリア
		document.querySelectorAll('input[name="marker_type"]').forEach(r => {
			r.addEventListener('change', (e) => {
				clearVector();
				const marker = document.getElementById('marker');
				if (marker) marker.style.display = 'none';
			});
		});

		function clearVector() {
			const canvas = document.getElementById('vectorCanvas');
			if (canvas) {
				const ctx = canvas.getContext('2d');
				ctx.clearRect(0, 0, canvas.width, canvas.height);
			}
			vectorStart = null;
			// hide controls and clear stored data
			const canvasEl = document.getElementById('vectorCanvas');
			if (canvasEl) {
				delete canvasEl.dataset.baseDistance;
				delete canvasEl.dataset.angle;
				delete canvasEl.dataset.startX;
				delete canvasEl.dataset.startY;
			}
			const vc = document.getElementById('vectorControls');
			if (vc) vc.style.display = 'none';
		}

		// Update canvas size and marker positions when image loads or window resizes
		function updateOverlay() {
			const img = document.getElementById('mapImage');
			const canvas = document.getElementById('vectorCanvas');
			const marker = document.getElementById('marker');
			const container = document.getElementById('mapContainer');
			if (!img || !canvas || !container) return;

			const imgLeft = img.offsetLeft;
			const imgTop = img.offsetTop;
			const iw = img.clientWidth || img.width || 0;
			const ih = img.clientHeight || img.height || 0;

			canvas.style.left = imgLeft + 'px';
			canvas.style.top = imgTop + 'px';
			canvas.width = Math.round(iw);
			canvas.height = Math.round(ih);
			canvas.style.width = iw + 'px';
			canvas.style.height = ih + 'px';

			const mx = document.getElementById('markerX').value;
			const my = document.getElementById('markerY').value;
			if (mx && my) {
				const lx = imgLeft + (iw * (parseFloat(mx) / 100));
				const ty = imgTop + (ih * (parseFloat(my) / 100));
				marker.style.left = lx + 'px';
				marker.style.top = ty + 'px';
				marker.style.display = 'block';
			} else {
				marker.style.display = 'none';
			}

			const mx2 = document.getElementById('markerX2').value;
			const my2 = document.getElementById('markerY2').value;
			if (mx && my && mx2 && my2) {
				const x1 = iw * (parseFloat(mx) / 100);
				const y1 = ih * (parseFloat(my) / 100);
				const x2 = iw * (parseFloat(mx2) / 100);
				const y2 = ih * (parseFloat(my2) / 100);
				const ctx = canvas.getContext('2d');
				ctx.clearRect(0, 0, canvas.width, canvas.height);
				drawArrow(x1, y1, x2, y2);
				document.getElementById('vectorControls').style.display = 'block';
			} else {
				const ctx = canvas.getContext('2d');
				ctx.clearRect(0, 0, canvas.width, canvas.height);
				document.getElementById('vectorControls').style.display = 'none';
			}
		}

		// Attach overlay update on image load and window resize
		document.getElementById('mapImage').addEventListener('load', updateOverlay);
		window.addEventListener('resize', updateOverlay);
		document.addEventListener('DOMContentLoaded', updateOverlay);
	</script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
