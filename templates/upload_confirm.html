<!DOCTYPE html>
<html lang="ja">
    
    <head>
        <meta charset="UTF-8">
        <title>アップロード確認 - 座標指定付き</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            background: #1c1c1c;
            color: white;
        }
        
        .center-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
        }
        /* マップ画像クリック用エリア */
        #mapContainer {
            position: relative;
            cursor: pointer;
            /* ポインターに統一 */
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 100%;
            max-height: 70vh;
            overflow: hidden;
        }
        
        #mapImage {
            display: block;
            max-width: 100%;
            max-height: 70vh;
            width: auto;
            height: auto;
            object-fit: contain;
            margin: 0 auto;
        }
        
        #marker {
            position: absolute;
            width: 10px;
            height: 10px;
            background: red;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
            pointer-events: none;
        }

        #vectorCanvas {
            position: absolute;
            pointer-events: none;
        }
        
        form {
            background: #2b2b2b;
            padding: 15px;
            border-radius: 6px;
            max-width: 500px;
            width: 100%;
        }

        form input,
        form select,
        form textarea,
        form button {
            width: 100%;
            margin-bottom: 10px;
            padding: 6px;
            border: none;
            border-radius: 4px;
        }

        img {
            max-width: 100%;
            margin-bottom: 10px;
            border: 1px solid #444;
            border-radius: 4px;
        }

        textarea {
            resize: none;
            font-size: 110%;
            width: 100%;
            height: 80px;
            background: #1c1c1c;
            color: white;
            border: 1px solid #444;
            padding: 6px;
        }

    </style>
</head>

<body>
    <div class="center-container">
        <h1>アップロード確認画面</h1>

        <!-- マップ表示とマーカー用エリア -->
        <div id="mapContainer">
            <img id="mapImage" src="/static/maps/{{ form_data.map_name }}.png">
            <canvas id="vectorCanvas"></canvas>
            <div id="marker"></div>
        </div>
        <form method="POST" action="{{ url_for('upload_confirm') }}">
            <!-- 確認用に読み取り専用表示 -->
            <label>マップ名:</label>
            <input type="text" value="{{ form_data.map_name_jp }}" readonly>
            <input type="hidden" name="map_name" value="{{ form_data.map_name }}">
            <!--座標-->
            <input type="hidden" name="marker_x" value="{{ form_data.marker_x }}" readonly>
            <input type="hidden" name="marker_y" value="{{ form_data.marker_y }}" readonly>
            <input type="hidden" name="marker_type" value="{{ form_data.marker_type }}">
            {% if form_data.vector_x2 %}
            <input type="hidden" name="vector_x2" value="{{ form_data.vector_x2 }}">
            <input type="hidden" name="vector_y2" value="{{ form_data.vector_y2 }}">
            {% endif %}

            <label>エージェント:</label>
            <input type="text" value="{{ form_data.agent_name_jp}}" readonly>
            <input type="hidden" name="agent_name" value="{{ form_data.agent_name }}">

            <label>着地点:</label>
            <input type="text" name="site" value="{{ form_data.site }}" readonly>

            <label>説明文:</label>
            <textarea name="description" readonly>{{ form_data.description }}</textarea>

            <label>定点画像:</label>
            <img name="file" src="{{ filepath }}" alt="定点画像">
            <input type="hidden" name="image_src" value="{{ filepath }}">

            {% if is_poition %}
            <label>立ち位置画像:</label>
            <img name="stand_file" src="{{ stand_filepath }}" alt="立ち位置画像">
            <input type="hidden" name="stand_image_src" value="{{ stand_filepath }}">
            <label>立ち位置説明文:</label>
            <textarea name="stand_description" readonly>{{ form_data.stand_description }}</textarea>
            {% endif %}

            <div class="d-flex gap-2 mt-3">
                <!-- 修正するボタン -->
                <button type="button" class="btn btn-secondary" onclick="window.location.href='/upload'">
                    修正する
                </button>

                <!-- 確定ボタン -->
                <button type="submit" class="btn btn-primary">確定</button>
            </div>
        </form>
    </div>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const marker = document.getElementById("marker");
            const img = document.getElementById("mapImage");
            const canvas = document.getElementById("vectorCanvas");

            // Jinja2から受け取ったデータ
            const markerType = "{{ form_data.marker_type }}";
            const xRatio = {{ form_data.marker_x | safe }};
            const yRatio = {{ form_data.marker_y | safe }};
            const vectorX2Ratio = {{ form_data.vector_x2 | safe if form_data.vector_x2 else "null" }};
            const vectorY2Ratio = {{ form_data.vector_y2 | safe if form_data.vector_y2 else "null" }};

            // 画像ロード・リサイズ時にキャンバスとマーカーを更新
            function updateOverlay() {
                const container = document.getElementById('mapContainer');
                if (!img || !canvas || !marker || !container) return;

                const imgRect = img.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();

                const imgLeft = imgRect.left - containerRect.left;
                const imgTop = imgRect.top - containerRect.top;
                const iw = imgRect.width || img.width || 0;
                const ih = imgRect.height || img.height || 0;

                // position canvas over the visible image
                canvas.style.left = imgLeft + 'px';
                canvas.style.top = imgTop + 'px';
                canvas.width = Math.round(iw);
                canvas.height = Math.round(ih);
                canvas.style.width = iw + 'px';
                canvas.style.height = ih + 'px';

                // marker position (relative to container)
                const x = imgLeft + (xRatio / 100) * iw;
                const y = imgTop + (yRatio / 100) * ih;

                if (!isNaN(x) && !isNaN(y)) {
                    marker.style.left = x + 'px';
                    marker.style.top = y + 'px';
                    marker.style.display = 'block';
                } else {
                    marker.style.display = 'none';
                }

                if (markerType === 'vector' && vectorX2Ratio !== null && vectorY2Ratio !== null) {
                    const x2 = (vectorX2Ratio / 100) * iw;
                    const y2 = (vectorY2Ratio / 100) * ih;
                    drawArrow((x - imgLeft), (y - imgTop), x2, y2);
                } else {
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }

            img.addEventListener('load', updateOverlay);
            window.addEventListener('resize', updateOverlay);
            document.addEventListener('DOMContentLoaded', updateOverlay);

            function drawArrow(x1, y1, x2, y2) {
                const ctx = canvas.getContext("2d");
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const headLen = 10;
                const angle = Math.atan2(y2 - y1, x2 - x1);

                // 矢印の線を描画
                ctx.strokeStyle = "red";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();

                // 矢印の先端を描画
                ctx.beginPath();
                ctx.moveTo(x2, y2);
                ctx.lineTo(
                    x2 - headLen * Math.cos(angle - Math.PI / 6),
                    y2 - headLen * Math.sin(angle - Math.PI / 6)
                );
                ctx.lineTo(
                    x2 - headLen * Math.cos(angle + Math.PI / 6),
                    y2 - headLen * Math.sin(angle + Math.PI / 6)
                );
                ctx.closePath();
                ctx.fillStyle = "red";
                ctx.fill();
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
</body>

</html>
