<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>定点表示画面</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1e1f2f;
            /* ダークネイビー／グレー */
            color: #e0e0e0;
        }

        .center-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            text-align: center;
        }

        .btn {
            width: auto;
        }

        .required {
            color: red;
            font-weight: bold;
        }

        /* マップ画像コンテナ */
        #mapContainer {
            position: relative;
            cursor: default;
            margin-bottom: 20px;
            display: inline-block;
        }

        #mapImage {
            display: block;
            max-width: 90vw;
            height: auto;
        }

        /* マーカー */
        .marker-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background: red;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: auto;
            cursor: pointer;
        }

        /* ベクトル描画用Canvas */
        #vectorCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        /* 画像コンテナ */
        .image-container {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
        }

        .image-container img {
            display: block;
            max-width: 100%;
            height: auto;
        }

        /* 虫眼鏡アイコン */
        .magnifying-glass {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 40px;
            height: 40px;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid #e0e0e0;
        }

        .magnifying-glass:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: #fff;
            transform: scale(1.1);
        }

        .magnifying-glass::before {
            content: '🔍';
            font-size: 24px;
        }

        /* 画像拡大モーダル */
        #imageModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        #imageModal.show {
            display: flex;
        }

        .image-modal-content {
            position: relative;
            width: 90vw;
            height: 90vh;
        }

        .image-modal-content img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* クローズボタン */
        .image-modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            font-weight: bold;
            color: #e0e0e0;
            cursor: pointer;
            transition: color 0.3s ease;
            z-index: 2001;
            background: none;
            border: none;
            padding: 0;
            line-height: 1;
        }

        .image-modal-close:hover {
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="center-container">
        <br>
        <h1>{{ agent_name_jp }}定点表示画面</h1>
        <button class="btn btn-secondary mb-3" onclick="location.href='/'" style="margin-left: 80%;">定点一覧へ</button>

        <!-- マップ表示＆複数マーカー -->
        <div id="mapContainer">
            <img id="mapImage" src="{{ map_img_path }}" alt="マップ画像">
            <canvas id="vectorCanvas"></canvas>
            {% for item in lineups %}
            <span class="marker-dot" data-lineup-id="{{ item.lineup_id }}" style="cursor: pointer;"
                onclick="openModal({{ item.lineup_id }})"
                title="{{ item.site }}"></span>
            {% endfor %}
        </div>
    </div>
    <!-- 画像拡大モーダル -->
    <div id="imageModal">
        <button class="image-modal-close" onclick="closeImageModal()">×</button>
        <div class="image-modal-content">
            <img id="expandedImage" src="" alt="拡大画像">
        </div>
    </div>
    <!-- マーカーモーダル（既存） -->
    <div class="modal fade" id="markerModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content bg-dark text-light">
                <div class="modal-header">
                    <h5 class="modal-title">定点詳細</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalContent">
                    <!-- JSで動的に内容を埋めます -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const lineups = {{ lineups | tojson }};
        const lineupImages = {{ lineup_images | tojson }};
        const pointEffects = {{ point_effects | tojson }};
        const vectorEffects = {{ vector_effects | tojson }};
        lineupImages.reverse();

        // マップ画像読み込み後に矢印やマーカーを描画
        window.addEventListener("DOMContentLoaded", () => {
            const mapImage = document.getElementById('mapImage');
            const canvas = document.getElementById('vectorCanvas');

            mapImage.addEventListener('load', () => {
                // Canvas のサイズをマップ画像に合わせる
                canvas.width = mapImage.width;
                canvas.height = mapImage.height;

                // マーカーの位置を設定（pointの場合）
                pointEffects.forEach(point => {
                    const marker = document.querySelector(`[data-lineup-id="${point.lineup_id}"]`);
                    if (marker) {
                        const x = (point.x / 100) * mapImage.width;
                        const y = (point.y / 100) * mapImage.height;
                        marker.style.left = x + 'px';
                        marker.style.top = y + 'px';
                    }
                });

                // ベクトルの矢印を描画
                vectorEffects.forEach(vector => {
                    const x1 = (vector.start_x / 100) * mapImage.width;
                    const y1 = (vector.start_y / 100) * mapImage.height;
                    const x2 = (vector.end_x / 100) * mapImage.width;
                    const y2 = (vector.end_y / 100) * mapImage.height;

                    drawArrow(canvas, x1, y1, x2, y2);

                    // ベクトル開始地点にマーカーを表示
                    const marker = document.querySelector(`[data-lineup-id="${vector.lineup_id}"]`);
                    if (marker) {
                        marker.style.left = x1 + 'px';
                        marker.style.top = y1 + 'px';
                    }
                });
            });

            // 画像がキャッシュから読み込まれている場合
            if (mapImage.complete) {
                mapImage.dispatchEvent(new Event('load'));
            }
        });

        function drawArrow(canvas, x1, y1, x2, y2) {
            const ctx = canvas.getContext('2d');
            const headLen = 10;
            const angle = Math.atan2(y2 - y1, x2 - x1);

            // 矢印の線を描画
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            // 矢印の先端を描画
            ctx.beginPath();
            ctx.moveTo(x2, y2);
            ctx.lineTo(
                x2 - headLen * Math.cos(angle - Math.PI / 6),
                y2 - headLen * Math.sin(angle - Math.PI / 6)
            );
            ctx.lineTo(
                x2 - headLen * Math.cos(angle + Math.PI / 6),
                y2 - headLen * Math.sin(angle + Math.PI / 6)
            );
            ctx.closePath();
            ctx.fillStyle = 'red';
            ctx.fill();
        }

        function openModal(id) {
            const imgs = lineupImages.filter(img => img.lineup_id === id);
            const container = document.getElementById('modalContent');
            container.innerHTML = '';  // 既存内容クリア

            const modalTitle = document.querySelector('#markerModal .modal-title');
            const lineupItem = lineups.find(l => l.lineup_id === id);
            modalTitle.textContent = lineupItem ? lineupItem.site : '定点詳細';

            imgs.forEach(img => {
                const div = document.createElement('div');
                div.classList.add('mb-3');
                div.innerHTML = `
                <div class="image-container">
                    <img src="${img.image_path}" class="img-fluid rounded" alt="">
                    <div class="magnifying-glass" onclick="expandImage('${img.image_path}', event)"></div>
                </div>
                <p>${img.description.replace(/(\r\n|\n|\r)/g, '<br>')}</p>
                `;
                container.appendChild(div);
            });
            const modal = new bootstrap.Modal(document.getElementById('markerModal'));
            modal.show();
        }

        function expandImage(imagePath, event) {
            event.stopPropagation();
            const modal = document.getElementById('imageModal');
            const expandedImage = document.getElementById('expandedImage');
            expandedImage.src = imagePath;
            modal.classList.add('show');
        }

        function closeImageModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.remove('show');
        }

        // モーダル外側クリックで閉じる
        document.getElementById('imageModal').addEventListener('click', function(event) {
            if (event.target === this) {
                closeImageModal();
            }
        });

        // Escキーでモーダルを閉じる
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeImageModal();
            }
        });
    </script>
</body>

</html>
