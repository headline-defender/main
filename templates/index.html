<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valorant 定点サイト</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #1e1f2f;
      color: #e0e0e0;
    }
    .form-container {
      background-color: #2a2c3e;
      border-radius: 8px;
      padding: 2rem;
    }
    .btn-accent {
      background-color: #22d3ee;
      color: #1e1f2f;
    }
    .btn-accent:hover {
      background-color: #ffffff;
      color: #000000;
    }

    /* グリッド共通 */
    .select-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 1rem;
    }
    .select-item {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      text-align: center;
      transition: transform 0.2s, filter 0.2s;
    }
    .select-item:hover {
      filter: brightness(1.2);
      transform: scale(1.05);
    }
    .select-item.active {
      outline: 3px solid #22d3ee;
      outline-offset: 0;
      border-radius: 8px;
    }

    /* マップ専用 */
    .select-item.map {
      width: 100%;
      height: 100px;
    }
    .select-item.map img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .select-item.map .select-label {
      position: absolute;
      bottom: 0;
      width: 100%;
      padding: 4px;
      background: rgba(0, 0, 0, 0.6);
      font-size: 0.9rem;
      color: #fff;
    }

    /* エージェント専用 */
    .select-item.agent {
      width: 60px;
      height: 60px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .select-item.agent img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      background-color: #1e1f2f;
      border-radius: 8px;
      display: block;
    }
    .select-item.agent .select-label {
      position: absolute;
      bottom: -18px; /* アイコンの下に表示 */
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      text-align: center;
      white-space: nowrap;
      color: #fff;
    }
  </style>
</head>
<body>
  <br>
  <h1 style="text-align: center;">Valorant 定点サイト</h1>
  <button type="button" class="btn btn-secondary" style="margin-left: 80%;" onclick="location.href='/upload'">アップロード画面へ</button>
  <div class="container py-5 d-flex justify-content-center">
    <div class="form-container col-md-10">
      <h1 class="mb-4 text-white">条件を選んでください</h1>
        <!-- フラッシュメッセージ -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert alert-warning" role="alert">
              {% for message in messages %}
                {{ message }}
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}
      <form method="GET" action="/view">
        
        <!-- マップ選択 -->
        <div class="mb-3">
          <h3>
            <label class="form-label">マップ</label>
          </h3>
          <div class="select-grid" id="mapGrid">
            {% for map in maps %}
            <div class="select-item map" data-value="{{ map.value }}">
              <img src="{{ map.image_path }}" alt="{{ map.label }}">
              <div class="select-label">{{ map.label }}</div>
            </div>
            {% endfor %}
          </div>
          <input type="hidden" name="map_name" id="mapInput">
        </div>

        <!-- エージェント選択 -->
        <div class="mb-3">
          <h3>
            <label class="form-label">エージェント</label>
          </h3>
          <div class="select-grid" id="agentGrid">
            {% for agent in agents %}
            <div class="select-item agent" data-value="{{ agent.value }}">
              <img src="{{ agent.image_path }}" alt="{{ agent.label }}">
              <div class="select-label">{{ agent.label }}</div>
            </div>
            {% endfor %}
          </div>
          <input type="hidden" name="agent_name" id="agentInput">
        </div>

        <button type="submit" class="btn btn-accent w-100">表示</button>
      </form>
    </div>
  </div>

  <script>
    function setupSelection(gridId, inputId) {
      const grid = document.getElementById(gridId);
      const input = document.getElementById(inputId);

      grid.querySelectorAll('.select-item').forEach(item => {
        item.addEventListener('click', () => {
          grid.querySelectorAll('.select-item').forEach(i => i.classList.remove('active'));
          item.classList.add('active');
          input.value = item.dataset.value;
        });
      });
    }

    setupSelection('mapGrid', 'mapInput');
    setupSelection('agentGrid', 'agentInput');
  </script>
</body>
</html>
